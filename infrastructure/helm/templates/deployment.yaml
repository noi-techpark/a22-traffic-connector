apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "a22-traffic-connector.labels" . | nindent 4 }}
spec:
  # exactly one instance: two followers would fetch and store the same data twice
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "a22-traffic-connector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "a22-traffic-connector.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # operation mode: follow | month <year> <month> | interval <start_ts> <end_ts>
          command: ["java", "-jar", "app.jar"]
          args:
            {{- range (splitList " " (.Values.operationMode | toString)) }}
            - {{ . | quote }}
            {{- end }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $key, $value := .Values.envSecret }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Release.Name }}-env-secret
                  key: {{ $key }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
