{{- if .Values.envSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-env-secret
  labels:
    {{- include "a22-traffic-connector.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.envSecret }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
